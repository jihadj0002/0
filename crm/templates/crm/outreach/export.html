<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email Export - {{ campaign.name }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 32px; color: #1e293b; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p { color: #64748b; margin: 0 0 24px; font-size: 0.88rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 10px 12px; border-bottom: 2px solid #e2e8f0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; font-weight: 700; white-space: nowrap; }
    td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    tr:hover td { background: #f8faff; }
    .name { font-weight: 600; color: #1e293b; white-space: nowrap; }
    .email { color: #2563eb; }
    .html-frame { width: 100%; min-height: 120px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; }
    .text-body { margin: 0; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.82rem; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; }
    .mailto-link { display: inline-block; margin-top: 4px; padding: 4px 10px; background: #eff6ff; color: #2563eb; border-radius: 6px; text-decoration: none; font-size: 0.78rem; font-weight: 600; }
    .mailto-link:hover { background: #dbeafe; }
  </style>
</head>
<body>
  <h1>Email Export — {{ campaign.name }}</h1>
  <p>{{ rows|length }} recipient(s)</p>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Subject</th>
        <th>HTML Body</th>
        <th>Text Body</th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <td class="name">{{ row.name }}</td>
        <td class="email">{{ row.email }}</td>
        <td>{{ row.subject }}</td>
        <td>
          <iframe srcdoc="{{ row.html|escape }}" class="html-frame"></iframe>
          <br>
          <a class="mailto-link" href="mailto:{{ row.email }}?subject={{ row.subject|urlencode }}">Send via Email Client</a>
        </td>
        <td><pre class="text-body">{{ row.text }}</pre></td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="5" style="text-align: center; padding: 48px 0; color: #94a3b8;">No recipients found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
