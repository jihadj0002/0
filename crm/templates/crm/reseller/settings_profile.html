{% extends "back/base.html" %}
{% block title %}Settings - Reseller{% endblock %}
{% block content %}
<style>
.form-card { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; max-width: 520px; margin-bottom: 20px; }
.form-card h2 { font-size: 1.15rem; margin: 0 0 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
.form-group input { width: 100%; padding: 8px 10px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
.form-group input:focus { outline: none; border-color: var(--accent); }
.form-actions { display: flex; gap: 12px; margin-top: 20px; }
.tab-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #d0d5dd; background: var(--panel); font-weight: 600; font-size: 0.9rem; cursor: pointer; }
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelector('.tab-btn[data-tab="' + name + '"]').classList.add('active');
}
</script>

<div class="page-header" style="margin-bottom: 16px;">
  <h1>Reseller Settings</h1>
</div>

<div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
  <button class="tab-btn active" data-tab="profile" onclick="switchTab('profile')">Profile</button>
  <button class="tab-btn" data-tab="password" onclick="switchTab('password')">Password</button>
</div>

<div id="tab-profile" class="tab-content active">
  <div class="form-card">
    <h2>Profile Information</h2>
    <form method="POST">
      {% csrf_token %}
      <input type="hidden" name="section" value="profile">
      <div class="form-group">
        <label>Username</label>
        <input type="text" value="{{ request.user.username }}" disabled style="opacity: 0.6;">
      </div>
      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" value="{{ request.user.first_name }}">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" value="{{ request.user.last_name }}">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ request.user.email }}">
      </div>
      <div class="form-group">
        <label>Business Name</label>
        <input type="text" name="business_name" value="{{ staff_profile.title }}">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ staff_profile.phone }}">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">Save Profile</button>
      </div>
    </form>
  </div>
</div>

<div id="tab-password" class="tab-content">
  <div class="form-card">
    <h2>Change Password</h2>
    <form method="POST">
      {% csrf_token %}
      <input type="hidden" name="section" value="password">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" required placeholder="Enter new password">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">Update Password</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
