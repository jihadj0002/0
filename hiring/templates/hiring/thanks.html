<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Received — MatrixAi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-white via-purple-50 to-indigo-50 text-gray-900 flex items-center justify-center px-6">
  <div class="pointer-events-none fixed inset-0 -z-10">
    <div class="absolute left-[-20%] top-[10%] w-[700px] h-[700px] rounded-full bg-purple-300/20 blur-[130px]"></div>
    <div class="absolute right-[-20%] bottom-[-10%] w-[800px] h-[800px] rounded-full bg-cyan-300/20 blur-[150px]"></div>
  </div>

  <div class="w-full max-w-lg bg-white/70 backdrop-blur-2xl border border-white/40 shadow-2xl rounded-3xl p-10 text-center">
    <div class="text-6xl mb-6">🎉</div>
    <h1 class="text-3xl font-bold text-purple-900">Application Received</h1>
    <p class="text-gray-600 mt-3">
      {% if application %}Thanks, {{ application.name }}!{% else %}Thank you!{% endif %}
      We've got your application and our sales team will review it soon.
    </p>
    <a href="/" class="inline-block mt-8 py-3 px-8 bg-purple-700 hover:bg-purple-800 text-white rounded-2xl transition">Back to Home</a>
  </div>
</body>
</html>
